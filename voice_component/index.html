<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{font:16px Arial,sans-serif;margin:0;color:#263b36;background:#fffefa}
button{border:0;border-radius:14px;background:#355f4f;color:white;font-weight:700;font-size:17px;padding:14px 20px;min-height:50px;cursor:pointer}
button:focus{outline:3px solid #d6a741;outline-offset:2px}
#status{margin:10px 2px;color:#52675c;min-height:22px}
</style>
</head>
<body>
<button id="talk" type="button">🎙 Tap to speak</button>
<div id="status" aria-live="polite">Use a short question, such as “What happens next?”</div>
<script>
(() => {
  const talk = document.getElementById("talk");
  const status = document.getElementById("status");
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  function send(type, data={}) { window.parent.postMessage({isStreamlitMessage:true,type,...data}, "*"); }
  send("streamlit:componentReady", {apiVersion:1});
  send("streamlit:setFrameHeight", {height:104});
  talk.addEventListener("click", () => {
    if (!Recognition) {
      status.textContent = "Voice recognition is unavailable in this browser. Try Microsoft Edge or Chrome.";
      return;
    }
    const recognition = new Recognition();
    recognition.lang = navigator.language || "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    talk.disabled = true;
    status.textContent = "Listening…";
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.trim();
      status.textContent = "Heard: “" + transcript + "”";
      send("streamlit:setComponentValue", {value:transcript});
    };
    recognition.onerror = (event) => { status.textContent = "I didn’t catch that. Please try again. (" + event.error + ")"; };
    recognition.onend = () => { talk.disabled = false; };
    recognition.start();
  });
})();
</script>
</body>
</html>

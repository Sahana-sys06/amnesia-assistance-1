<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body{font:14px Arial,sans-serif;color:#263b36;margin:0;padding:8px;background:#fffefa}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.field{flex:1;min-width:130px}
label{display:block;font-weight:600;margin-bottom:5px}input,select{box-sizing:border-box;width:100%;padding:9px;border:1px solid #dfe6db;border-radius:9px;background:white;color:#263b36}
button{padding:10px 12px;border:1px solid #dfe6db;border-radius:9px;background:#fffefa;color:#355f4f;font-weight:700;cursor:pointer}
button.primary{background:#355f4f;color:white;border-color:#355f4f}button:disabled{opacity:.48;cursor:not-allowed}
#status{padding:10px;margin:8px 0;background:#edf3e9;border-radius:9px;font-weight:600;min-height:18px}
.hint{color:#61736b;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<div class="hint">Connect the ESP32 USB serial port here. In Edge, select its COM port. Close Arduino Serial Monitor first.</div>
<div class="row"><button id="connect" class="primary">Connect ESP32</button><button id="disconnect" disabled>Disconnect</button></div>
<div class="row"><div class="field"><label for="reminder">Reminder</label><select id="reminder"></select></div><button id="send" disabled>Send reminder</button></div>
<div id="status" role="status" aria-live="polite">Ready. No device selected.</div>
<div class="hint">A recognized name is sent automatically after you press “Check this photo”.</div>
<script>
let reminders=[],recognizedEvent=null,handledEventId=null,port=null,reader=null,reading=false,doseId=Math.floor(Date.now()/1000);
const $=id=>document.getElementById(id),statusBox=$('status'),choice=$('reminder');
function status(message){statusBox.textContent=message;}
function buttons(){$('connect').disabled=!!port;$('disconnect').disabled=!port;$('send').disabled=!port||!reminders.length;}
function clean(value,limit){return String(value).replace(/[|\r\n]+/g,' ').replace(/\s+/g,' ').trim().slice(0,limit);}
function hhmm(value){const s=String(value||'').trim();let m=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);if(m){let h=Number(m[1])%12;if(m[3].toUpperCase()==='PM')h+=12;return `${String(h).padStart(2,'0')}:${m[2]}`;}m=s.match(/^(?:[01]\d|2[0-3]):[0-5]\d$/);return m?s:'';}
async function writeLine(line){if(!port||!port.writable)throw new Error('ESP32 is disconnected.');const writer=port.writable.getWriter();try{await writer.write(new TextEncoder().encode(line+'\n'));}finally{writer.releaseLock();}}
async function readLoop(activePort){let buffer='';const decoder=new TextDecoder();reading=true;try{while(port===activePort&&activePort.readable){reader=activePort.readable.getReader();try{while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split(/\r?\n/);buffer=lines.pop()||'';for(const raw of lines){const line=raw.trim();if(!line)continue;const ack=line.match(/^ACKNOWLEDGED\|(\d+)$/i);if(ack&&Number(ack[1])>0)status(`Button acknowledgement received for reminder ${ack[1]}.`);else if(line.startsWith('INFO|'))status(line.slice(5));}}}finally{reader.releaseLock();reader=null;}}}catch(error){if(port===activePort)status(`Serial read ended: ${error.message}`);}finally{reading=false;}}
async function sendRecognized(event){if(!event||!event.id||event.id===handledEventId)return;if(!port){status(`Recognized ${clean(event.name,48)}. Connect the ESP32 to show it on the OLED.`);return;}try{await writeLine(`PERSON|${clean(event.name,48)}|Recognized`);handledEventId=event.id;status(`Recognized person sent to OLED: ${clean(event.name,48)}.`);}catch(error){status(`Could not send recognized person: ${error.message}`);}}
function receiveRender(event){const msg=event.data;if(!msg||msg.type!=='streamlit:render')return;const args=msg.args||{};reminders=Array.isArray(args.reminders)?args.reminders:[];recognizedEvent=args.recognized_person||null;choice.replaceChildren();reminders.forEach((item,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=`${item.time||''} · ${item.title||'Reminder'}`;choice.appendChild(option);});buttons();sendRecognized(recognizedEvent);}
window.addEventListener('message',receiveRender);window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:245},'*');
$('connect').addEventListener('click',async()=>{if(!('serial'in navigator)){status('Web Serial is unavailable here. Open this HTTPS app in desktop Edge or Chrome.');return;}try{status('Choose the ESP32 USB device in the browser prompt…');const selected=await navigator.serial.requestPort();await selected.open({baudRate:115200});port=selected;buttons();status('Connected. Select a reminder or check a person photo.');readLoop(selected);sendRecognized(recognizedEvent);}catch(error){port=null;buttons();status(`Could not connect: ${error.message}`);}});
$('disconnect').addEventListener('click',async()=>{const old=port;port=null;buttons();try{if(reader)await reader.cancel();}catch(_){}try{if(old)await old.close();status('ESP32 disconnected.');}catch(error){status(`Disconnected: ${error.message}`);}});
$('send').addEventListener('click',async()=>{const item=reminders[Number(choice.value)];if(!item){status('Add a reminder in Manage reminders first.');return;}const title=clean(item.title,18),time=hhmm(item.time);doseId=Math.max(Math.floor(Date.now()/1000),doseId+1);try{await writeLine(`MED|${doseId}|${title}|${time}`);status(`Sent “${title}” to the OLED.`);}catch(error){status(`Could not send reminder: ${error.message}`);}});
if(!window.isSecureContext)status('Web Serial needs the hosted HTTPS app.');if(!('serial'in navigator))status('Web Serial is not available in this browser. Try desktop Edge or Chrome.');navigator.serial?.addEventListener('disconnect',event=>{if(port===event.target){port=null;buttons();status('ESP32 USB device disconnected.');}});buttons();
</script>
</body>
</html>

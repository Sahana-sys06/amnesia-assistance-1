<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body{font:14px Arial,sans-serif;color:#263b36;margin:0;padding:8px;background:#fffefa}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{padding:10px 14px;border:1px solid #dfe6db;border-radius:9px;background:#355f4f;color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.48;cursor:not-allowed}
#status{padding:10px;margin:8px 0;background:#edf3e9;border-radius:9px;font-weight:600}
video{display:block;width:min(100%,640px);height:auto;border-radius:10px;background:#17241e}
.hint{color:#61736b;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<div class="row"><button id="start">Start camera</button><button id="stop" disabled>Stop camera</button></div>
<div id="status" role="status" aria-live="polite">Press Start camera and allow access to your webcam.</div>
<video id="preview" autoplay muted playsinline></video>
<canvas id="capture" width="480" height="360" hidden></canvas>
<div class="hint">The app checks a frame about once per second while the camera is running. You can stop it at any time.</div>
<script>
const $=id=>document.getElementById(id),video=$('preview'),canvas=$('capture'),statusBox=$('status');
let stream=null,timer=null,sequence=0,active=false;
function send(value){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value},'*');}
function status(text){statusBox.textContent=text;}
async function captureFrame(){if(!active||!video.videoWidth)return;const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0,canvas.width,canvas.height);const frame=canvas.toDataURL('image/jpeg',0.72);sequence++;send({frame,sequence});}
async function start(){if(active)return;if(!navigator.mediaDevices?.getUserMedia){status('Camera access is not available in this browser. Open this HTTPS app in desktop Edge or Chrome.');return;}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();active=true;$('start').disabled=true;$('stop').disabled=false;status('Camera is on. Checking for familiar people…');timer=setInterval(captureFrame,1000);captureFrame();}catch(error){status(`Could not start camera: ${error.message}. Check Edge camera permission and close other camera apps.`);}}
function stop(){active=false;if(timer){clearInterval(timer);timer=null;}if(stream){stream.getTracks().forEach(track=>track.stop());stream=null;}video.srcObject=null;$('start').disabled=false;$('stop').disabled=true;status('Camera stopped.');send({stopped:true,sequence:++sequence});}
$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);
window.addEventListener('message',event=>{const msg=event.data;if(msg?.type==='streamlit:render'){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:460},'*');}});
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:460},'*');
</script>
</body>
</html>
